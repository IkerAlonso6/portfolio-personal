<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Iker Alonso · Portfolio</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12124d">
  <meta
    name="description"
    content="Portfolio de Iker Guillermo Alonso, desarrollador full stack: Angular, Java, Spring Boot y bases de datos."
  >
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    rel="preload"
    as="font"
    type="font/woff2"
    crossorigin
    href="https://fonts.gstatic.com/s/vt323/v18/pxiKyp0ihIEF2isfFJU.woff2"
  >
  <link
    href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
    rel="stylesheet"
  >
  <link rel="icon" type="image/png" href="/icons8-desarrollador-16.png">
  <script>
    (function () {
      var colored = '/icons8-desarrollador-16.png';
      var white = '/icons8-desarrollador-16-white.png';
      var links = document.querySelectorAll('link[rel="icon"]');
      var cache = {};
      function preload(src) {
        if (!cache[src]) {
          var img = new Image();
          img.src = src;
          cache[src] = img;
        }
      }
      preload(colored);
      preload(white);
      function swap(icon) {
        links.forEach(function (link) {
          link.href = icon;
        });
      }
      function update() {
        swap(document.visibilityState === 'visible' ? white : colored);
      }
      document.addEventListener('visibilitychange', update);
      update();
    })();
  </script>

</head>
<body>
  <app-root></app-root>
</body>
</html>
